<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Compass — Onboarding Dashboard</title>

  <!-- Tailwind CSS (play CDN with JIT) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#1e1e2e',
            panel:   '#2a2a3e',
            border:  '#3b3b54',
            accent:  '#7c6af7',
            muted:   '#8b8ba0',
          }
        }
      }
    }
  </script>

  <!-- marked.js — Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- mermaid.js — Diagram renderer -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="dark h-full bg-surface text-slate-200 flex overflow-hidden">

  <!-- ── Sidebar ───────────────────────────────────────────────────── -->
  <aside class="w-60 flex-shrink-0 bg-panel border-r border-border flex flex-col">
    <div class="px-6 py-5 border-b border-border">
      <span class="text-accent font-bold text-lg tracking-tight">Code Compass</span>
      <p class="text-muted text-xs mt-0.5">Onboarding Dashboard</p>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1" id="sidebar-nav">
      <button data-view="architecture"
        class="nav-item w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-border hover:text-white transition-colors">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        Architecture
      </button>

      <button data-view="modules"
        class="nav-item w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-border hover:text-white transition-colors">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
        Modules
      </button>

      <button data-view="danger-zones"
        class="nav-item w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-border hover:text-white transition-colors">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        Danger Zones
      </button>

      <button data-view="quiz"
        class="nav-item w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-border hover:text-white transition-colors">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Quiz
      </button>
    </nav>

    <div class="px-4 py-3 border-t border-border text-xs text-muted">
      Zero-build · Client-side only
    </div>
  </aside>

  <!-- ── Main Content ───────────────────────────────────────────────── -->
  <main class="flex-1 overflow-y-auto">
    <div id="content" class="mx-auto max-w-4xl px-8 py-8">
      <div class="text-muted text-sm animate-pulse">Loading…</div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
